[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
borsh = { version = "1.6.1", features = ["derive"] }
solana-program = "4.0.0"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
thiserror = "2.0.18"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# GOVERNANCE_MINT is compiled to one network's BACH mint (see src/lib.rs).
# Default targets devnet; build with --features testnet for the testnet mint.
# These are mutually exclusive — do not enable more than one.
default = ["devnet"]
devnet = []
testnet = []
mainnet = []
