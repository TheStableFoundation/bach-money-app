name = "bach-money-app"
description = "The Stable Foundation — Bach Money monorepo (smbCloud Deploy)."

# Umbrella workspace. runner = 255 (Monorepo) makes `smb deploy` operate on the
# [[projects]] entries below; deploy a single app with `smb deploy -p <name>`.
[project]
id = 35
name = "bach-money-app"
runner = 255

# ── apps/app — the Bach Money dApp (Next.js SSR) ─────────────────────────────
# Domains (nginx → 127.0.0.1:3017, one server block, SAN cert "bach-money-app"):
#   - app.bach.money         (canonical; A 159.69.86.233)
#   - bachmoney-app.5mb.app  (smbCloud subdomain)
[[projects]]
id = 35
name = "bachmoneyapp"
frontend_app_id = "a5b57a49-a3f6-42b0-9b22-a1d62cc1c7b6"
deploy_repo_id = 25
runner = 0
kind = "nextjs-ssr"
source = "apps/app"
source_path = "apps/app"
path = "apps/web/bachmoneyapp"
port = 3017
pm2_app = "bachmoneyapp"
package_manager = "pnpm"

